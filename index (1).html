<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budega Digital · Geração Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5fb;--card:#fff;--tx:#1d1b2e;--mu:#6b6880;--pr:#6c3df4;--pr2:#ede7ff;--ok:#12a150;--wa:#d9480f;--bd:#e3e0f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14121f;--card:#1e1b2e;--tx:#f0eefa;--mu:#a09cb8;--pr:#9b7bff;--pr2:#2b2545;--ok:#3ccf7a;--wa:#ff9966;--bd:#34304a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14121f;--card:#1e1b2e;--tx:#f0eefa;--mu:#a09cb8;--pr:#9b7bff;--pr2:#2b2545;--ok:#3ccf7a;--wa:#ff9966;--bd:#34304a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:1.15rem;margin:0}h1 span{color:var(--pr)}
.wallet{background:var(--pr2);color:var(--pr);padding:6px 14px;border-radius:99px;font-weight:700}
nav{display:flex;gap:6px;padding:10px 20px;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--mu);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff}
main{max-width:980px;margin:0 auto;padding:10px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.item{display:flex;flex-direction:column;gap:6px}
.em{font-size:2.4rem}.pr{font-weight:800;color:var(--pr);font-size:1.1rem}
.mu{color:var(--mu);font-size:.85rem}
button.b{border:0;background:var(--pr);color:#fff;padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.g{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:7px 11px;border-radius:10px;font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.tbl{overflow-x:auto}
h2{font-size:1.05rem;margin:18px 0 10px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--wa);font-weight:700}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--pr2);color:var(--pr)}
.tag.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.off{opacity:.5}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);max-width:380px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:9}
.center{text-align:center;padding:50px 20px}

@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap");
:root{--bg:#f4f8ff;--card:#fff;--tx:#0b2a5b;--mu:#5d7194;--pr:#0a5bd0;--pr2:#e3eeff;--ok:#12a150;--wa:#d9480f;--bd:#d6e3f7;--grad:linear-gradient(135deg,#1e7bff,#0a4bb8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1630;--card:#122246;--tx:#eaf1ff;--mu:#9bb0d3;--pr:#5aa0ff;--pr2:#1b3366;--bd:#27407a}}
:root[data-theme="dark"]{--bg:#0b1630;--card:#122246;--tx:#eaf1ff;--mu:#9bb0d3;--pr:#5aa0ff;--pr2:#1b3366;--bd:#27407a}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative;overflow-x:hidden;min-height:100vh}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#4aa3ff,#0a5bd0 70%);pointer-events:none}
body::before{width:420px;height:420px;top:-200px;right:-150px;opacity:.9}
body::after{width:340px;height:340px;bottom:-190px;left:-140px;opacity:.9}
header{background:#fff;border-bottom:0;box-shadow:0 4px 20px rgba(10,91,208,.12);border-radius:0 0 24px 24px;padding:10px 24px}
.logo{height:64px;width:auto;mix-blend-mode:multiply;display:block}
.wallet{background:var(--grad);color:#fff;padding:9px 18px;font-weight:800;box-shadow:0 4px 12px rgba(10,91,208,.35)}
.hero{max-width:980px;margin:0 auto;padding:26px 20px 4px}
.hero h1{font-size:clamp(1.7rem,5vw,2.8rem);font-weight:800;line-height:1.1;color:var(--pr);margin:0;text-transform:uppercase;letter-spacing:-.5px}
.hero h1 b{display:block;color:var(--tx)}
.hero p{color:var(--mu);margin:10px 0 12px;max-width:520px}
.bar{display:block;width:56px;height:5px;border-radius:9px;background:var(--pr)}
nav button{font-weight:700}
nav button.on{background:var(--grad);box-shadow:0 4px 12px rgba(10,91,208,.3)}
.card{border-radius:20px;box-shadow:0 6px 22px rgba(10,91,208,.08)}
.item{align-items:flex-start;transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(10,91,208,.18)}
.em{width:66px;height:66px;border-radius:50%;background:var(--pr2);display:grid;place-items:center;font-size:2rem;margin-bottom:4px}
.pr{font-weight:800}
button.b{background:var(--grad);border-radius:99px;padding:10px 18px;font-weight:700;width:100%;margin-top:4px}
button.g{border-radius:99px;font-weight:600}
h2{font-weight:800;color:var(--tx)}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:10px 20px 30px}
footer b{color:var(--pr)}
/* Fundo Budega Digital: mangá + sertão */
body::before,body::after{display:none}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bg .fx{position:absolute;inset:0;width:100%;height:100%}
#bg .ch{position:absolute;bottom:0;height:auto;filter:drop-shadow(0 6px 10px rgba(10,91,208,.18))}
#bg .don{right:max(1vw,6px);width:clamp(150px,19vw,260px)}
#bg .cac{left:max(1vw,6px);width:clamp(110px,13vw,190px)}
#bg .sun{position:absolute;top:96px;right:2vw;width:clamp(90px,10vw,150px)}
#bg .tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#bg .fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box}
#bg .bob{animation:fl 4s ease-in-out infinite}
#bg .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.2;transform:scale(.55)}}
@keyframes fl{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){#bg .ch{opacity:.5}#bg .sun{display:none}}
@media(prefers-reduced-motion:reduce){#bg *{animation:none!important}}
</style>
</head>

var SEED=[["caneta","Caneta personalizada","🖊️",50,30],["mousepad","Mouse pad","🟦",120,15],["cinema","Ingresso de cinema","🎬",200,20],["ifood","Cartão presente iFood","🍔",250,10],["googleplay","Cartão Google Play","📱",300,10],["netflix","Cartão Netflix","🍿",350,8],["playstation","Cartão PlayStation","🎮",400,6],["mouse","Mouse Bluetooth","🖱️",500,5],["teclado","Teclado gamer para PC","⌨️",900,3]];

var enc=new TextEncoder();
function sha(t){return crypto.subtle.digest("SHA-256",enc.encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function slug(u){return String(u||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")}
function admPage(){return /\/adm\/?$/.test(location.pathname)||location.hash==="#adm"}
function setRole(r){S.role=r;S.tab=null;render()}
function logout(){
  var wasAdm=S.role==="admin";
  S.role=null;S.acc=null;S.accId=null;try{if(typeof S.unsub==="function")S.unsub()}catch(e){}S.unsub=null;
  if(wasAdm&&S.auth)S.auth.signOut();
  render();
}
function allOrders(){var l=[];S.spends.forEach(function(d){(d.orders||[]).forEach(function(o){l.push({uid:d.id,d:d,o:o})})});return l}
function balanceOf(ac){return ac.balance-allOrders().filter(function(x){return x.o.acc===ac.id}).reduce(function(t,x){return t+x.o.price},0)}
function soldOf(id){return allOrders().filter(function(x){return x.o.itemId===id}).length}
function render(){
  var a=$("#app"),nav=$("#nav");
  if(S.role==="admin"&&!S.admin)S.role=null;
  if(!S.role){nav.innerHTML="";$("#top").innerHTML="";return vLogin(a)}
  var adm=S.role==="admin";
  if(!adm&&!S.acc)return logout();
  var tabs=adm?[["adm-itens","⚙️ Itens"],["adm-alunos","👥 Alunos"],["adm-pedidos","📦 Pós-venda"]]:[["loja","🛍️ Loja"],["carteira","👛 Minha carteira"]];
  if(!tabs.some(function(t){return t[0]===S.tab}))S.tab=tabs[0][0];
  nav.innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'<button data-t="__out" style="margin-left:auto">🚪 Sair</button>';
  nav.querySelectorAll("button").forEach(function(b){b.onclick=function(){if(b.dataset.t==="__out")return logout();S.tab=b.dataset.t;render()}});
  $("#top").innerHTML=adm?'<span class="wallet">Administrador</span>':'<span class="mu">Olá, '+esc(S.acc.name)+'</span> <span class="wallet">'+fmt(balanceOf(S.acc))+' GT Coins</span>';
  if(S.tab==="loja")return vLoja(a);
  if(S.tab==="carteira")return vCarteira(a);
  if(S.tab==="adm-itens")return vAdmItens(a);
  if(S.tab==="adm-alunos")return vAdmAlunos(a);
  vAdmPedidos(a);
}
function vLogin(a){
  var keep={};["lu","ls","ae","ap"].forEach(function(k){var e=document.getElementById(k);if(e)keep[k]=e.value});
  var showAdm=admPage(),adm;
  if(S.cfgErr)adm='<p class="mu">Firebase não configurado. Preencha FIREBASE_CONFIG no código.</p>';
  else if(!S.db)adm='<p class="mu">Conectando…</p>';
  else if(S.admin)adm='<p class="mu">Conectado como '+esc(S.email)+'</p><p><button class="b" id="la2">Abrir painel</button></p><p><button class="g" id="lo">Sair desta conta</button></p>';
  else adm='<label>E-mail do administrador</label><input id="ae" type="email" autocomplete="username"><label>Senha</label><input id="ap" type="password" autocomplete="current-password"><p><button class="b" id="la">Entrar</button></p>';
  a.innerHTML='<h2 style="text-align:center">Entrar na Budega Digital</h2>'+(S.db||S.cfgErr?'':'<p class="mu" style="text-align:center">Conectando à loja…</p>')+'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:'+(showAdm?720:380)+'px;margin:0 auto"><div class="card"><div class="em">🎓</div><h2 style="margin-top:4px">Área do aluno</h2><label>Usuário</label><input id="lu" autocomplete="username"><label>Senha</label><input id="ls" type="password" autocomplete="current-password"><p><button class="b" id="lb">Entrar</button></p><p class="mu">Seu usuário e senha são criados pela equipe.</p></div>'+(showAdm?'<div class="card"><div class="em">🛠️</div><h2 style="margin-top:4px">Área administrativa</h2>'+adm+'</div>':'')+'</div>';
  Object.keys(keep).forEach(function(k){var e=document.getElementById(k);if(e)e.value=keep[k]});
  a.querySelectorAll("input").forEach(function(i){i.onkeydown=function(e){if(e.key==="Enter"){var b=i.closest(".card").querySelector("button.b");if(b)b.click()}}});
  $("#lb").onclick=function(){
    if(!S.db||!S.uid)return toast("Sem conexão. Tente de novo em instantes.");
    var id=slug($("#lu").value),pw=$("#ls").value;if(!id||!pw)return toast("Informe usuário e senha");
    var first=true,dead=false,tm;
    sha(id+":"+pw).then(function(h){
      var u=S.db.doc("accounts/"+id).onSnapshot(function(d){
        if(dead)return;
        var x=d.exists?d.data():null;
        if(first){if((!x||x.hash!==h)&&d.metadata&&d.metadata.fromCache)return;first=false;clearTimeout(tm);
          if(!x||x.hash!==h){dead=true;try{u()}catch(e){}return toast("Usuário ou senha incorretos")}
          S.unsub=function(){dead=true;try{u()}catch(e){}};
          S.accId=id;S.acc=Object.assign({id:id},x);return setRole("student")}
        if(!x){toast("Sua conta foi removida");return logout()}
        S.acc=Object.assign({id:id},x);render();
      },function(){dead=true;clearTimeout(tm);toast("Erro de conexão")});
      tm=setTimeout(function(){if(first&&!dead){dead=true;try{u()}catch(e){}toast("Não foi possível confirmar o login. Tente de novo.")}},10000);
    });
  };
  var la=$("#la");
  if(la)la.onclick=function(){
    var e=$("#ae").value.trim(),p=$("#ap").value;if(!e||!p)return toast("Informe e-mail e senha");
    S.wantAdm=true;
    S.auth.signInWithEmailAndPassword(e,p).catch(function(){S.wantAdm=false;toast("E-mail ou senha incorretos")});
  };
  var la2=$("#la2");if(la2)la2.onclick=function(){setRole("admin")};
  var lo=$("#lo");if(lo)lo.onclick=function(){S.auth.signOut()};
}
function stockLeft(i){var n=Number(i.stock);if(isNaN(n))n=0;return n-(i.id?soldOf(i.id):0)}
function stockTxt(n){return n<=0?'<span style="color:var(--wa);font-weight:700">Esgotado</span>':n<=3?'<span style="color:var(--wa);font-weight:700">'+(n===1?"Última unidade!":"Só restam "+n)+'</span>':n+" em estoque"}
function vLoja(a){
  var its=S.items.filter(function(i){return i.active!==false}),av=balanceOf(S.acc);
  if(!its.length){a.innerHTML='<div class="center mu">Nenhum brinde disponível no momento.</div>';return}
  a.innerHTML='<div class="grid">'+its.map(function(i){var st=stockLeft(i),ok=av>=i.price&&st>0;return '<div class="card item"><div class="em">'+esc(i.emoji)+'</div><b>'+esc(i.name)+'</b><div class="pr">'+fmt(i.price)+' GT Coins</div><div class="mu">'+stockTxt(st)+'</div><button class="b" data-id="'+esc(i.id)+'" '+(ok?"":"disabled")+'>'+(st<=0?"Esgotado":ok?"Comprar":"Saldo insuficiente")+'</button></div>'}).join("")+'</div>';
  a.querySelectorAll("button.b").forEach(function(b){b.onclick=function(){resgatar(b.dataset.id)}});
}
function resgatar(id){
  var it=S.items.find(function(i){return i.id===id});if(!it)return;
  if(balanceOf(S.acc)<it.price)return toast("Saldo insuficiente");
  if(stockLeft(it)<=0)return toast("Esse brinde esgotou");
  if(!confirm("Confirmar a compra de "+it.name+" por "+fmt(it.price)+" GT Coins?"))return;
  var my=S.spends.find(function(d){return d.id===S.uid}),now=Date.now();
  var orders=((my&&my.orders)||[]).concat([{id:String(now),itemId:it.id,item:it.name,price:it.price,acc:S.accId,name:S.acc.name,date:now,status:"aguardando"}]);
  S.db.doc("spend/"+S.uid).set({orders:orders}).then(function(){toast("Compra confirmada! Retire seu brinde com a equipe 🎉")}).catch(function(){toast("Erro ao comprar")});
}
function vCarteira(a){
  var os=allOrders().filter(function(x){return x.o.acc===S.accId}).map(function(x){return x.o}).sort(function(x,y){return y.date-x.date});
  var ex=(S.acc.history||[]).concat(os.map(function(o){return {date:o.date,text:"Compra: "+o.item,amount:-o.price}})).sort(function(x,y){return y.date-x.date});
  a.innerHTML='<div class="card"><div class="mu">Saldo atual</div><div class="pr" style="font-size:2rem">'+fmt(balanceOf(S.acc))+' GT Coins</div><div class="mu">Olá, '+esc(S.acc.name)+'!</div></div>'+
  '<h2>Minhas compras</h2><div class="card">'+(os.length?os.map(function(x){return '<div class="row"><span>'+esc(x.item)+' <span class="mu">· '+dt(x.date)+'</span></span><span class="tag '+(x.status==="entregue"?"ok":"")+'">'+(x.status==="entregue"?"entregue":"aguardando entrega")+'</span></div>'}).join(""):'<span class="mu">Nenhuma compra ainda.</span>')+'</div>'+
  '<h2>Extrato</h2><div class="card">'+(ex.length?ex.slice(0,60).map(function(x){return '<div class="row"><span>'+esc(x.text)+' <span class="mu">· '+dt(x.date)+'</span></span><span class="'+(x.amount>=0?"pos":"neg")+'">'+(x.amount>=0?"+":"")+fmt(x.amount)+'</span></div>'}).join(""):'<span class="mu">Sem movimentações.</span>')+'</div>';
}
function seedItems(){
  if(!confirm("Cadastrar os 9 brindes padrão?"))return;
  var b=S.db.batch();
  SEED.forEach(function(s){b.set(S.db.doc("items/"+s[0]),{name:s[1],emoji:s[2],price:s[3],stock:s[4],active:true})});
  b.commit().then(function(){toast("Brindes cadastrados ✔")}).catch(function(){toast("Erro ao cadastrar")});
}
function vAdmItens(a){
  a.innerHTML='<p><button class="b" id="new">+ Novo item</button></p>'+(S.items.length?'':'<p><button class="g" id="seed">📦 Cadastrar os 9 brindes padrão</button></p>')+'<div class="card">'+(S.items.length?S.items.map(function(i){return '<div class="row '+(i.active===false?"off":"")+'"><span>'+esc(i.emoji)+' '+esc(i.name)+' <b class="pr">'+fmt(i.price)+' GT Coins'+'</b> <span class="mu">· estoque: '+stockLeft(i)+'</span>'+(i.active===false?' <span class="tag">oculto</span>':"")+'</span><button class="g" data-id="'+esc(i.id)+'">Editar</button></div>'}).join(""):'<span class="mu">Nenhum item cadastrado.</span>')+'</div>';
  $("#new").onclick=function(){editItem(null)};
  var sd=$("#seed");if(sd)sd.onclick=seedItems;
  a.querySelectorAll("button.g[data-id]").forEach(function(b){b.onclick=function(){editItem(S.items.find(function(i){return i.id===b.dataset.id}))}});
}
function editItem(it){
  var d=$("#dlg"),n=!it;it=it||{name:"",price:100,emoji:"🎁",active:true};
  d.innerHTML='<h2 style="margin-top:0">'+(n?"Novo item":"Editar item")+'</h2><label>Emoji</label><input id="e1" maxlength="4" value="'+esc(it.emoji)+'"><label>Nome</label><input id="e2" value="'+esc(it.name)+'"><label>Preço (GT Coins)</label><input id="e3" type="number" min="0" value="'+esc(it.price)+'"><label>Estoque atual (unidades)</label><input id="e5" type="number" min="0" value="'+esc(n?10:stockLeft(it))+'"><label><input id="e4" type="checkbox" style="width:auto" '+(it.active!==false?"checked":"")+'> Visível na loja</label><div style="display:flex;gap:8px;margin-top:14px;justify-content:space-between"><span>'+(n?"":'<button class="g" id="del">Excluir</button>')+'</span><span><button class="g" id="cx">Cancelar</button> <button class="b" id="ok">Salvar</button></span></div>';
  d.showModal();$("#cx").onclick=function(){d.close()};
  if(!n)$("#del").onclick=function(){if(confirm("Excluir este item?"))S.db.doc("items/"+it.id).delete().then(function(){d.close()})};
  $("#ok").onclick=function(){
    var data={name:$("#e2").value.trim(),emoji:$("#e1").value.trim()||"🎁",price:Math.max(0,Math.round(Number($("#e3").value)||0)),stock:Math.max(0,Math.round(Number($("#e5").value)||0))+(n?0:soldOf(it.id)),active:$("#e4").checked};
    if(!data.name)return toast("Informe o nome");
    var ref=n?S.db.collection("items").doc():S.db.doc("items/"+it.id);
    ref.set(data).then(function(){d.close();toast("Salvo ✔")}).catch(function(){toast("Erro ao salvar")});
  };
}
function dlg(title,body,ok){var d=$("#dlg");d.innerHTML='<h2 style="margin-top:0">'+title+'</h2>'+body+'<div style="text-align:right;margin-top:14px"><button class="g" id="cx">Cancelar</button> <button class="b" id="ok" style="width:auto">Confirmar</button></div>';d.showModal();$("#cx").onclick=function(){d.close()};$("#ok").onclick=function(){ok(d)}}
function vAdmAlunos(a){
  var ws=S.accounts.slice().sort(function(x,y){return x.name.localeCompare(y.name)});
  a.innerHTML='<p><button class="b" id="new" style="width:auto">+ Novo aluno</button></p><div class="card tbl">'+(ws.length?ws.map(function(w){return '<div class="row"><span><b>'+esc(w.name)+'</b> <span class="mu">@'+esc(w.id)+'</span></span><span><b class="pr">'+fmt(balanceOf(w))+' GT Coins</b> <button class="g" data-a="c" data-id="'+esc(w.id)+'">Moedas</button> <button class="g" data-a="p" data-id="'+esc(w.id)+'">Senha</button> <button class="g" data-a="d" data-id="'+esc(w.id)+'">Excluir</button></span></div>'}).join(""):'<span class="mu">Nenhum aluno cadastrado. Crie o primeiro com o botão acima.</span>')+'</div>';
  $("#new").onclick=newStudent;
  a.querySelectorAll("button.g").forEach(function(b){b.onclick=function(){
    var w=S.accounts.find(function(x){return x.id===b.dataset.id});if(!w)return;
    if(b.dataset.a==="c")credit(w);else if(b.dataset.a==="p")setPwd(w);
    else if(confirm("Excluir "+w.name+"?"))S.db.doc("accounts/"+w.id).delete().then(function(){toast("Aluno excluído")});
  }});
}
function newStudent(){
  dlg("Novo aluno",'<label>Nome</label><input id="n1" maxlength="50"><label>Usuário (letras e números, sem espaços)</label><input id="n2" maxlength="30"><label>Senha inicial (mín. 4 caracteres)</label><input id="n3" type="text">',function(d){
    var nm=$("#n1").value.trim(),id=slug($("#n2").value),pw=$("#n3").value;
    if(!nm||!id)return toast("Preencha nome e usuário");
    if(pw.length<4)return toast("Senha muito curta");
    if(S.accounts.some(function(x){return x.id===id}))return toast("Esse usuário já existe");
    sha(id+":"+pw).then(function(h){S.db.doc("accounts/"+id).set({name:nm,hash:h,balance:0,history:[],orders:[]}).then(function(){d.close();toast("Aluno criado ✔")}).catch(function(){toast("Erro ao criar")})});
  });
}
function setPwd(w){
  dlg("Nova senha de "+esc(w.name),'<label>Nova senha (mín. 4 caracteres)</label><input id="n3" type="text">',function(d){
    var pw=$("#n3").value;if(pw.length<4)return toast("Senha muito curta");
    sha(w.id+":"+pw).then(function(h){S.db.doc("accounts/"+w.id).update({hash:h}).then(function(){d.close();toast("Senha alterada ✔")})});
  });
}
function credit(w){
  dlg(esc(w.name),'<label>Valor (negativo para descontar)</label><input id="c1" type="number" value="10"><label>Motivo</label><input id="c2" placeholder="Ex.: Desafio da aula 5" maxlength="80">',function(d){
    var v=Math.round(Number($("#c1").value)||0);if(!v)return;
    var hist=[{date:Date.now(),text:$("#c2").value.trim()||(v>0?"Crédito da equipe":"Ajuste da equipe"),amount:v}].concat(w.history||[]).slice(0,60);
    S.db.doc("accounts/"+w.id).update({balance:Math.max(0,w.balance+v),history:hist}).then(function(){d.close();toast("Carteira atualizada ✔")}).catch(function(){toast("Erro")});
  });
}
function vAdmPedidos(a){
  var list=allOrders().sort(function(x,y){return ((x.o.status==="entregue")-(y.o.status==="entregue"))||y.o.date-x.o.date});
  a.innerHTML='<p class="mu">Compras já confirmadas pelos alunos (saldo e estoque debitados na hora). Aqui você acompanha a entrega e, se preciso, cancela e estorna.</p><div class="card tbl">'+(list.length?list.map(function(x,i){var ok=x.o.status==="entregue";return '<div class="row"><span><b>'+esc(x.o.item)+'</b> <span class="mu">· '+esc(x.o.name)+' · '+dt(x.o.date)+' · '+fmt(x.o.price)+' GT Coins</span></span><span>'+(ok?'<span class="tag ok">entregue</span> ':'<button class="b" style="width:auto" data-a="ok" data-i="'+i+'">Marcar entregue</button> ')+'<button class="g" data-a="no" data-i="'+i+'">Cancelar e estornar</button></span></div>'}).join(""):'<span class="mu">Nenhuma compra ainda.</span>')+'</div>';
  a.querySelectorAll("button").forEach(function(b){b.onclick=function(){
    var x=list[Number(b.dataset.i)],orders;
    if(b.dataset.a==="ok")orders=x.d.orders.map(function(o){return o.id===x.o.id?Object.assign({},o,{status:"entregue"}):o});
    else{if(!confirm("Cancelar a compra de "+x.o.item+" de "+x.o.name+"? O saldo e o estoque serão devolvidos."))return;orders=x.d.orders.filter(function(o){return o.id!==x.o.id})}
    S.db.doc("spend/"+x.uid).set({orders:orders}).then(function(){toast(b.dataset.a==="ok"?"Marcado como entregue ✔":"Compra cancelada e estornada ✔")}).catch(function(){toast("Erro")});
  }});
}
function snap(q){return q.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function init(){
  render();
  if(!window.firebase||FIREBASE_CONFIG.apiKey==="COLE_AQUI"){S.cfgErr=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  S.auth=firebase.auth();
  var db=firebase.firestore();
  db.collection("items").onSnapshot(function(q){S.items=snap(q).sort(function(a,b){return a.price-b.price});render()},function(){});
  S.auth.onAuthStateChanged(function(u){
    if(!u){S.uid=null;S.admin=false;S.auth.signInAnonymously().catch(function(){toast("Erro ao conectar. Ative o login anônimo no Firebase.")});return}
    var em=(u.email||"").toLowerCase(),isAdm=!u.isAnonymous&&em===ADMIN_EMAIL.toLowerCase();
    if(!u.isAnonymous&&!isAdm){S.wantAdm=false;toast("Essa conta não é de administrador");S.auth.signOut();return}
    S.db=db;S.uid=u.uid;S.email=u.email||"";S.admin=isAdm;
    if(S.spUnsub)S.spUnsub();
    S.spUnsub=db.collection("spend").onSnapshot(function(q){S.spends=snap(q);render()},function(){});
    if(isAdm&&!S.accUnsub)S.accUnsub=db.collection("accounts").onSnapshot(function(q){S.accounts=snap(q);render()},function(){});
    if(!isAdm&&S.accUnsub){S.accUnsub();S.accUnsub=null;S.accounts=[]}
    if(isAdm&&S.wantAdm){S.wantAdm=false;return setRole("admin")}
    render();
  });
}
window.addEventListener("hashchange",function(){if(!S.role)render()});
init();
</script>
</body>
</html>
